answers:
  help: >
    Я предназначен для автоматизации проверки домашних заданий
    по курсу *газовой динамики*.


    Для того, чтобы со мной работать, необходимо *зарегистрироваться*.
    Это можно сделать командой /reg, нажать "Зарегистрироваться" на клавиатуре
    или просто написать сообщение с текстом "Зарегистрироваться".

    В моей базе данных есть информация (ФИО) о преподавателях и студентах.
    При регистрации я добавлю в неё только ваш Telegram ID.
    Он пригодится для того, чтобы я мог присылать вам информацию
    о домашних заданиях, успеваемости и тому подобном.


    По командам /help\_teacher и /help\_student я дам вам больше информации.

  help_teacher: >
    *Для преподавателей*


    Зарегистрированный преподаватель может:

    ⚜️ получать список студентов;

    ⚜️ получать информацию об успеваемости (кто взял ДЗ, кто выполнил, когда и на сколько баллов и т.п.);

    ⚜️ оценивать работы студентов.

  help_student: >
    *Для студентов*


    Зарегистрировавшись, вы сможете получить индивидуальное домашнее задание, после чего
    сможете присылать мне решение в формате [YAML](https://blog.skillfactory.ru/glossary/yaml/)-файла.
    Я его проверяю и показываю результат проверки.


    ✅ Если всё правильно, то я записываю информацию о вашем решении
    и *сообщаю преподавателю, который выставляет окончательную оценку после
    проверки вашего текстового отчёта*.

    ❌ Если есть ошибки, то вы просто снова присылаете файл с исправленным решением.

  help_yaml: >
    *Шаблон файла с решением домашнего задания*


    Пример файла YAML с ответом на пример домашнего задания из
    [методических указаний](https://press.bmstu.ru/catalog/item/7208/) Н.В. Быкова
    прикреплён к сообщению.


    YAML-файл - это просто текстовый файл с определённым синтаксисом,
    облегчающим интерпретацию хранящихся в нём данных.

  help_pyyaml: >
    *YAML в Python*

    YAML-файл можно сформировать с помощью библиотеки [pyyaml](https://habr.com/ru/articles/669684/).
    Установить её можно так:

    ```bash
    pip install pyyaml
    ```


    Работа с YAML в Python завязана на использовании словаря (`dict`).
    Вот как можно сформировать файл ответов, используя Python:

    ```python

    import yaml

    # Словарь словарей
    
    data = {
        'Информация': {
            'Вариант': 777,
            ...
        },
        'Сопло': {
            'Диаметр критического сечения, м': 0.6,
            'Диаметр выходного сечения, м': 2.1,
            ...
        },
        'Физика': {
            ...
        },
        'Расчётное сопло': {
            ...
        }
    }

    with open(path_to_file, "r", encoding='utf-8') as f:
        yaml.safe_dump(data, f)
    ```

    Для меня не важен порядок ключей словаря.
    Разумеется, вместо явного или ручного указания значений полей
    *следует использовать переменные из расчётной программы Python, хранящие соответствующие результаты*.
 
  whats_next_teacher: >
    Теперь я могу писать вам сообщения, например, когда студент сдал ДЗ
    с правильными ответами, прикрепляя для проверки его текстовый отчёт.

  whats_next_student: >
    Теперь вы можете получить домашнее задание командой /get\_homework
    или с помощью клавиатуры, а затем сдать на проверку решение командой
    /check\_homework с прикреплённым YAML-файлом (или использовать клавиатуру).
 
  homework_nozzle: >
    *Расчет одномерных течений газа в соплах*


    Для заданных параметров газа в камере
    (полное давление _p_₀, полная температура _T_₀, индивидуальная газовая постоянная _R_, показатель адиабаты _k_)
    и геометрии сопла (диаметр камеры _D_\_к, диаметр критического сечения _d_\*, углы α и β)
    *решить следующие задачи*.
    
    
    1. По заданным геометрическим параметрам построить геометрию сопла Лаваля
    и график зависимости площади поперечного сечения сопла от координаты.
    
    2. Определить газодинамические характеристики течения в сопле.
    
    
    2.1. Найти распределение числа Маха и скоростного коэффициента λ по координате с использованием
    численных методов для решения нелинейных уравнений вида _f_(_x_) = 0.
    Для этого как в дозвуковой, так и в сверхзвуковой части нужно взять не менее 50 расчетных точек.
    
    2.2. Найти распределение всех газодинамических параметров
    (скорости течения газа, давления, температуры, плотности) по длине сопла и построить соответствующие графики.
    Проанализировать и объяснить изменение всех газодинамических величин по длине сопла.
    
    2.3. Проанализировать и объяснить поведение расхода, приходящегося на единицу площади поперечного сечения,
    j = ρυ по длине сопла.
    
    2.4. Построить график массового расхода _G_ по длине сопла и сделать соответствующие выводы.
    
    
    3. Рассчитать силовые характеристики сопла.
    
    
    3.1. При внешнем давлении равном атмосферному (_p_\_н = 10⁵ Па) вычислить тягу и удельную тягу.
    
    3.2. Определить степень нерасчетности сопла при заданных геометрических параметрах.
    Рассчитать потребную длину сопла, при которой оно работает на расчетном режиме.
    
    3.3. Рассчитать тягу сопла в вакууме и удельную тягу в ваку уме.
    Определить идеальную скорость ракеты по формуле Циолковского при заданном отношении массы топлива
    к массе ракеты μ\_т.
    
    
    4. Сформулировать соответствующие выводы.

  homework_shock_wedge: >
    *Расчет системы косых скачков уплотнения*


    Дан трехступенчатый клин с углами поворота β₁, β₂, β₃ (все углы отсчитывают от горизонтали),
    обтекаемый однородным потоком воздуха с постоянной скоростью, соответствующей расчетному числу Маха M\_p
    (схема показана на прикреплённой картинке).

    Необходимо *решить следующие задачи*.


    1. Определить характеристики течения.


    1.1. Рассчитать углы наклона образующихся КСУ относительно к горизонтали.

    1.2. Рассчитать относительное изменение газодинамических параметров (плотности, давления и температуры)
    при прохождении газового потока через систему КСУ.

    1.3. Определить суммарный коэффициент восстановления полного давления для полученной системы КСУ.


    2. Решить задачу фокусировки системы КСУ для полученных значений углов наклона КСУ и клина.

    2.1. Определить координаты точек излома ступенчатого клина из условия фокусировки системы КСУ в заданной точке.
    Принять высоту точки фокусировки за единицу.

    2.2. Построить графически ступенчатый клин и систему КСУ на нем.


    3. Исследовать чувствительность системы КСУ к изменению углов клина.


    3.1. Определить зависимость коэффициента восстановления полного давления от углов ступенчатого клина
    β₁ и β₂, построить ее график (угол β₃ фиксирован и соответствует его исходному значению).
    *В каждой точке зависимости система КСУ должна существовать (не должно быть отошедших скачков)*.

    3.2. Определить углы β₁\* и β₂\*, соответствующие максимальному значению коэффициента восстановления
    полного давления, и найти его значение.

    3.3. Решить задачу фокусировки системы КСУ при углах клина β₁\*, β₂\* и β₃,
    изобразить графически полученный результат.
    Сравнить длину полученного клина с длиной исходного клина, полученного в пункте 2.


    4. Сформулировать соответствующие выводы
